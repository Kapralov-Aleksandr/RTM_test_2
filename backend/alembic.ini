# Alembic — миграции схемы БД
# Команды (из папки backend):
#   alembic upgrade head                  — накатить миграции
#   alembic revision --autogenerate -m "…" — создать новую

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///../data/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
